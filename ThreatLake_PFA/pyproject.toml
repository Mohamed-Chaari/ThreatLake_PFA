[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threatlake-pfa"
version = "0.1.0"
description = "ThreatLake PFA - a focused, submittable subset of ThreatLake AI: cowrie honeypot ingestion, a batch Bronze/Silver/Gold Delta lakehouse, two attack detectors, and a small read-only API + dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "pyspark>=4.0.0,<4.1",
    "delta-spark>=4.0.0,<4.1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "requests>=2.32,<3",
    "sqlglot>=25,<31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/threatlake"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "spark: test requires a live SparkSession (slow)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyspark.*",
    "ignore::FutureWarning:pyspark.*",
]

[tool.coverage.run]
source = ["src/threatlake"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
